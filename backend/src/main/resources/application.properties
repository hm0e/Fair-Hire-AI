# FairHire AI - Spring Boot Application Configuration
# Server Port (Defaults to 8088 to avoid common 8080 conflicts)
server.port=${SERVER_PORT:8088}

# Spring Application Name
spring.application.name=fairhire-backend

# Data Source Configuration
# Canonical development database: Docker PostgreSQL 16 (fairhire_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fairhire_db}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate: Schema is managed strictly by Flyway migrations; Hibernate validates
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration (Phase 2B canonical schema migrations)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# AI/NLP Microservice URL (FastAPI Python Service)
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# JWT Security
jwt.secret=${JWT_SECRET:fairhire-ai-secret-key-2026-research-edition-spring-boot-jwt-token-key-32chars}
jwt.expiration-hours=24

# File Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
upload.dir=./uploads
