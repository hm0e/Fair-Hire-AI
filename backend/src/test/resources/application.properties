# FairHire AI - Isolated Test Execution Configuration
server.port=0
spring.application.name=fairhire-backend-test

# Isolated in-memory H2 test database for fast, independent test execution
spring.datasource.url=jdbc:h2:mem:fairhire_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for unit slice tests until Phase 2 domain migrations are created
spring.flyway.enabled=false

# AI service URL
ai.service.url=http://localhost:5000

# Test JWT Secret
jwt.secret=fairhire-ai-secret-key-2026-research-edition-spring-boot-jwt-token-key-32chars
jwt.expiration-hours=24
